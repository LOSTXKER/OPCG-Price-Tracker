<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#100C09" />
    <title>ออฟไลน์ | Meecard</title>
    <!--
      Served by the service worker when a page load fails with no network.
      Hand-written and dependency-free on purpose: it has to render from cache
      with zero requests, so no fonts, no framework, no external CSS.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px 24px;
        text-align: center;
        background: #100c09;
        color: #f5efe9;
        font-family:
          "Kanit", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      img {
        width: 128px;
        height: 128px;
        border-radius: 28px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 30ch;
        font-size: 15px;
        line-height: 1.6;
        color: #b3a79d;
      }
      button {
        margin-top: 4px;
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #e0b865;
        color: #241a12;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>ตอนนี้ไม่มีเน็ต</h1>
    <p>Meecard ต้องต่อเน็ตเพื่อดึงราคาล่าสุด ลองเช็คสัญญาณแล้วกดลองใหม่ได้เลย</p>
    <button type="button" onclick="location.reload()">ลองใหม่</button>
  </body>
</html>
